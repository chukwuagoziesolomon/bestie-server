services:
  - type: web
    name: bestyy-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT bestyy.asgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: bestyy.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: bestyy-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bestyy-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com,https://your-admin-domain.com

databases:
  - name: bestyy-db
    plan: free
    databaseName: bestyy
    user: bestyy_user
